# Starting version catalog for a Compose app. Versions checked on 2026-11-07 where marked;
# run `./gradlew dependencyUpdates` or Android Studio's upgrade assistant before first use.
# Versions marked "check" were not verified for this template — set them from each library's
# release page.

[versions]
agp = "9.5.0"                      # verified: developer.android.com/build/releases/gradle-plugin
kotlin = "2.4.21"                  # verified: kotlinlang.org/docs/releases.html
composeBom = "2026.09.00"          # verified: developer.android.com/develop/ui/compose/bom
navigation3 = "1.2.1"              # verified: developer.android.com/jetpack/androidx/releases/navigation3
ksp = "check"
hilt = "check"
androidxHiltNavigationCompose = "check"
room = "check"
datastore = "check"
work = "check"
lifecycle = "check"
activityCompose = "check"
appcompat = "check"
coroutines = "check"
turbine = "check"
junit = "4.13.2"
robolectric = "check"
benchmark = "check"
profileinstaller = "check"
androidxTestExt = "check"
uiautomator = "check"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
